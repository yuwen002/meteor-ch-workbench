<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteor CH Workbench</title>
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div id="app"></div>
    <script>
      (function () {
        function show(msg) {
          var el = document.getElementById('__err');
          if (!el) {
            el = document.createElement('pre');
            el.id = '__err';
            el.style.cssText =
              'position:fixed;top:0;left:0;right:0;z-index:99999;max-height:40vh;overflow:auto;' +
              'margin:0;padding:10px;background:#7f1d1d;color:#fff;font:12px/1.5 Consolas,monospace;' +
              'white-space:pre-wrap;word-break:break-all;border-bottom:2px solid #ef4444;';
            document.body.appendChild(el);
          }
          el.textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) {
          show('[error] ' + (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('[unhandledrejection] ' + (r && r.stack ? r.stack : String(r)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
