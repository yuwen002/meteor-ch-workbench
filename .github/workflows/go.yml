name: Go CI

on:
  push:
    branches:
      - main
      - feat/native-gui-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gio Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: |
          go mod download all
          grep '^gioui.org/x ' go.sum || true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build preview binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/meteor-ch-workbench ./cmd/meteor-ch-gio

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-ch-workbench-linux-amd64
          path: dist/meteor-ch-workbench
          if-no-files-found: error
          retention-days: 7

  windows-preview:
    name: Windows preview
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download all

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build Windows preview
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/meteor-ch-workbench.exe ./cmd/meteor-ch-gio
        shell: pwsh

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-ch-workbench-windows-amd64
          path: dist/meteor-ch-workbench.exe
          if-no-files-found: error
          retention-days: 7
